name: validate release actions
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-title-check
        id: title
        with:
          title: ${{ github.event.pull_request.title }}
      - run: echo "status=${{ steps.title.outputs.status }}"
      - if: steps.title.outputs.status == 'error'
        run: exit 1

  publishable-and-version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-publishable
        id: publishable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base_sha: ${{ github.event.before }}
          head_sha: ${{ github.sha }}
          ignore_config: .github/release-ignore.json
      - run: echo "should_release=${{ steps.publishable.outputs.should_release }}"
      - uses: ./.github/actions/release-version
        id: version
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: v
      - run: echo "bump=${{ steps.version.outputs.bump }} version=${{ steps.version.outputs.version }} tag=${{ steps.version.outputs.tag }}"
